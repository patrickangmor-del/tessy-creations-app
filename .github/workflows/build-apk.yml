name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tessy-creations-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Also publish as a direct-download Release asset (a plain .apk file,
      # not a zip) so it can be downloaded and installed straight from a
      # phone browser without needing a computer to unzip anything.
      - name: Publish APK to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK build
          body: Automatically built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: build/app/outputs/flutter-apk/app-release.apk
