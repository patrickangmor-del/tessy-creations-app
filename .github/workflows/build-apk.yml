name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"

      # Use a fixed debug-signing key (checked into ci/keystore/) instead of
      # the random one each fresh CI machine would otherwise generate, so
      # this build's signature matches the last one and Android can install
      # it as an update instead of forcing an uninstall (which wipes app data).
      - name: Install fixed debug-signing key
        run: |
          mkdir -p ~/.android
          cp ci/keystore/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Give every build a unique, ever-increasing version number
      # (GitHub's run number always goes up). Android refuses to install an
      # APK as an "update" over an existing app unless its version number is
      # higher than what's already installed, so without this every build
      # here would carry the same version number (from pubspec.yaml) and
      # updates would fail, forcing an uninstall first.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: tessy-creations-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Also publish as a direct-download Release asset (a plain .apk file,
      # not a zip) so it can be downloaded and installed straight from a
      # phone browser without needing a computer to unzip anything.
      - name: Publish APK to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK build
          body: Automatically built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
          files: build/app/outputs/flutter-apk/app-release.apk
